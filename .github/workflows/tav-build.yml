name: tav-build
# tav（mino-tav）全端构建验证——与 mac-build/win-build 同一公壳模式：
# deploy key 只读 checkout 私仓 mino-tav 到 tav/ 前缀，runner 上跑 rust 门禁 + wasm + 桌面三端 + android + ios。
# 源仓 mino-tav 内 ci.yml 是同内容副本，private 计费恢复后可直接用；本文件是当前有效构建通道。
# mobile 的 gen/（android init / ios init）在 runner 现场生成——init 需要 SDK/Xcode，不入库。

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'mino-tav ref（分支或 commit）'
        required: false
        default: 'main'

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust / fmt+clippy+test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 694410194/mino-tav
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.TAV_BUILD_SSH_KEY }}
          ssh-known-hosts: ${{ secrets.MAC_BUILD_KNOWN_HOSTS }}
          path: tav
      - name: install dependencies（tav-host 链接 webkit）
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: tav/ui/package-lock.json
      - name: build ui（host generate_context 需要 ui/dist）
        working-directory: tav
        run: npm --prefix ui ci && npm --prefix ui run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: tav
      - working-directory: tav
        run: cargo fmt --all --check
      - working-directory: tav
        run: cargo clippy --workspace --all-targets -- -D warnings
      - working-directory: tav
        run: cargo test --workspace

  gates:
    name: ai-gates / drift+deny+secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 694410194/mino-tav
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.TAV_BUILD_SSH_KEY }}
          ssh-known-hosts: ${{ secrets.MAC_BUILD_KNOWN_HOSTS }}
          path: tav
      - name: meta-gate 门禁完整性（防绕过，规则 15）
        working-directory: tav
        run: python3 scripts/verify_gates.py
      - name: agents.md drift check
        working-directory: tav
        run: bash scripts/verify-agents.sh
      - name: 架构边界门禁
        working-directory: tav
        run: bash scripts/verify-arch.sh
      - name: 文档漂移门禁（ADR-0006）
        working-directory: tav
        run: bash scripts/verify-docs.sh
      - name: 债务标记门禁（硬规则 12）
        working-directory: tav
        run: bash scripts/verify-debt.sh
      - name: i18n 对账
        working-directory: tav
        run: python3 scripts/verify_i18n.py
      - name: ls-lint（文件/目录命名门禁）
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - working-directory: tav
        run: npx --yes @ls-lint/ls-lint
      - name: cargo deny（许可/漏洞/源/重复）
        working-directory: tav
        run: |
          cargo install cargo-deny --locked
          cargo deny check
      - name: gitleaks（密钥扫描）
        working-directory: tav
        env:
          GITLEAKS_VERSION: "8.24.0"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks git --redact -v .

  ui:
    name: ui / svelte-check+build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 694410194/mino-tav
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.TAV_BUILD_SSH_KEY }}
          ssh-known-hosts: ${{ secrets.MAC_BUILD_KNOWN_HOSTS }}
          path: tav
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: tav/ui/package-lock.json
      - working-directory: tav
        run: npm --prefix ui ci
      - working-directory: tav
        run: npm --prefix ui run check
      - working-directory: tav
        run: npm --prefix ui run test
      - working-directory: tav
        run: npm --prefix ui run build

  smoke:
    name: ui / browser smoke（wasm+IndexedDB）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 694410194/mino-tav
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.TAV_BUILD_SSH_KEY }}
          ssh-known-hosts: ${{ secrets.MAC_BUILD_KNOWN_HOSTS }}
          path: tav
      - working-directory: tav
        run: bash scripts/build-wasm.sh
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: tav/ui/package-lock.json
      - working-directory: tav
        run: npm --prefix ui ci
      - working-directory: tav
        run: npm --prefix ui run build
      - working-directory: tav
        run: npm --prefix ui run smoke

  wasm:
    name: wasm32 / core+store+host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 694410194/mino-tav
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.TAV_BUILD_SSH_KEY }}
          ssh-known-hosts: ${{ secrets.MAC_BUILD_KNOWN_HOSTS }}
          path: tav
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: tav
      - working-directory: tav
        run: cargo clippy --lib -p tav-core -p tav-store-wasm -p tav-wasm-host -p tav-jsapi --target wasm32-unknown-unknown -- -D warnings

  desktop:
    name: desktop / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - name: macos-x86_64
            platform: macos-latest
            args: --target x86_64-apple-darwin
          - name: ubuntu
            platform: ubuntu-22.04
            args: ""
          - name: windows
            platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 694410194/mino-tav
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.TAV_BUILD_SSH_KEY }}
          ssh-known-hosts: ${{ secrets.MAC_BUILD_KNOWN_HOSTS }}
          path: tav

      - name: install dependencies (ubuntu only)
        if: matrix.name == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev patchelf xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: tav/apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: tav

      - name: install frontend dependencies
        working-directory: tav
        run: |
          npm --prefix ui ci
          npm --prefix ui run build
          npm --prefix apps/desktop ci

      - uses: tauri-apps/tauri-action@v1
        with:
          projectPath: tav/apps/desktop
          args: ${{ matrix.args }}

      - name: upload bundles（安装包产物——release 实测物料）
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            tav/target/release/bundle/
            tav/target/*/release/bundle/
          retention-days: 7

  android:
    name: android / apk debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 694410194/mino-tav
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.TAV_BUILD_SSH_KEY }}
          ssh-known-hosts: ${{ secrets.MAC_BUILD_KNOWN_HOSTS }}
          path: tav
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: tav/apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: tav
      - name: NDK env (runner image exposes ANDROID_NDK_LATEST_HOME)
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: install frontend dependencies
        working-directory: tav
        run: |
          npm --prefix ui ci
          npm --prefix ui run build
          npm --prefix apps/desktop ci
      - name: tauri android init
        working-directory: tav/apps/desktop
        run: npm run tauri -- android init
      - name: tauri android build (debug apk)
        working-directory: tav/apps/desktop
        run: npm run tauri -- android build --debug --apk

  ios:
    name: ios / simulator debug
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 694410194/mino-tav
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.TAV_BUILD_SSH_KEY }}
          ssh-known-hosts: ${{ secrets.MAC_BUILD_KNOWN_HOSTS }}
          path: tav
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: tav/apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: tav
      - name: install frontend dependencies
        working-directory: tav
        run: |
          npm --prefix ui ci
          npm --prefix ui run build
          npm --prefix apps/desktop ci
      - name: tauri ios init
        working-directory: tav/apps/desktop
        run: npm run tauri -- ios init
      - name: tauri ios build (debug, simulator — unsigned)
        working-directory: tav/apps/desktop
        run: npm run tauri -- ios build --debug --target aarch64-sim

  status:
    name: status / 回传 commit status 到 mino-tav（分支保护数据源）
    if: always()
    needs: [rust, gates, ui, smoke, wasm, desktop, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 694410194/mino-tav
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.TAV_BUILD_SSH_KEY }}
          ssh-known-hosts: ${{ secrets.MAC_BUILD_KNOWN_HOSTS }}
          path: tav
      - name: post commit status
        working-directory: tav
        env:
          GH_TOKEN: ${{ secrets.TAV_STATUS_TOKEN }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SHA=$(git rev-parse HEAD)
          if echo "$NEEDS_JSON" | jq -e '[.[] | select(.result != "success")] | length == 0' >/dev/null; then
            STATE=success
          else
            STATE=failure
          fi
          echo "posting $STATE for $SHA"
          gh api "repos/694410194/mino-tav/statuses/$SHA" -f state="$STATE" -f context=tav-build             -f target_url="$RUN_URL" -f description="mino-build 全端构建验证"
